name: Scraper
on:
  schedule:
    - cron: '18 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build payloads, do NOT call Make.com)"
        type: boolean
        default: false
      max_posts:
        description: "Max Facebook posts this run"
        default: "5"

# Never let two runs overlap (they would race on the tracker file)
concurrency:
  group: scraper
  cancel-in-progress: false

# Needed so the job can commit the tracker CSV back to the repo
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY:     ${{ secrets.MAKE_API_KEY }}
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || '5' }}
          DRY_RUN:          ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          HF_OFFLINE:       "0"
        run: python dz.py

      # Persist the duplicate-tracker so jobs are never posted twice
      - name: Commit tracker file
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_jobs_algeria.csv
          if git diff --staged --quiet; then
            echo "No tracker changes."
          else
            git commit -m "chore: update job tracker [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload Excel output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-output-${{ github.run_id }}
          path: |
            jobs_output_algeria.xlsx
            processed_jobs_algeria.csv
          retention-days: 7
